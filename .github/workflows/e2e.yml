name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerforge
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Development settings (DEBUG on, local only) against a throwaway database.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://careerforge:careerforge@localhost:5432/careerforge
      DJANGO_SECRET_KEY: e2e-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      THROTTLE_AUTH_RATE: 100/minute
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput

      - name: Generate the synthetic resume fixture
        run: python scripts/make_e2e_resume_pdf.py frontend/e2e/.generated/e2e-resume.pdf

      - name: Install frontend and Playwright Chromium
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # playwright.config.ts starts Django (runserver) and Vite itself.
      - name: Run end-to-end tests
        id: e2e
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e-output.txt

      - name: Publish summary
        if: always()
        working-directory: frontend
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo "## End-to-end tests (Playwright, Chromium)"
            echo "Result: **${E2E_OUTCOME}**"
            if [ -s e2e-output.txt ]; then
              echo '```'
              tail -n 40 e2e-output.txt
              echo '```'
            fi
            echo "Playwright version: $(npx playwright --version 2>/dev/null || echo unknown)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate results
        if: always()
        working-directory: frontend
        run: |
          esc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          [ -s e2e-output.txt ] || exit 0
          summary=$(grep -E "^\s*[0-9]+ (passed|failed|flaky|skipped)" e2e-output.txt | tr -s ' \n' ' ')
          echo "::notice title=playwright::${summary:-no summary line}"
          if grep -qE "^\s*[0-9]+ failed|Error:" e2e-output.txt; then
            body=$(grep -E -m1 -A 30 "(✘|Error:|Timed out|webServer)" e2e-output.txt | cut -c1-200 | esc)
            echo "::error title=playwright failure::${body}"
          fi

      # Screenshots for the README (synthetic data) and the package-lock.json
      # this run resolved, so it can be committed for reproducible installs.
      - name: Upload screenshots and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-lockfile
          path: |
            frontend/e2e/.generated/screenshots/
            frontend/package-lock.json
          if-no-files-found: warn
          include-hidden-files: true   # screenshots live under e2e/.generated/
          retention-days: 14

      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
