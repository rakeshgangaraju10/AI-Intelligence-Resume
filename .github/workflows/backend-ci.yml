name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned so the runner image doesn't change underneath us (ubuntu-latest moves to 26 in Oct 2026).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerforge
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://careerforge:careerforge@localhost:5432/careerforge
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema generates without warnings
        run: python manage.py spectacular --fail-on-warn --file /tmp/schema.yml

      - name: Run tests
        run: |
          set -o pipefail
          pytest --cov=apps --cov-report=term-missing 2>&1 | tee pytest-output.txt

      # Shows the pass count and coverage table on the run's Summary page,
      # so nobody has to dig through step logs.
      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo '```'
            grep -E "^=+ .*(passed|failed|error).* =+$" pytest-output.txt | tail -n 1 || echo "no pytest summary line found"
            echo '```'
            echo "## Coverage"
            coverage report --format=markdown || echo "coverage report unavailable"
          } >> "$GITHUB_STEP_SUMMARY"
