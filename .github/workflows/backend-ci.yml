name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned so the runner image doesn't change underneath us (ubuntu-latest moves to 26 in Oct 2026).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerforge
          POSTGRES_USER: careerforge
          POSTGRES_PASSWORD: careerforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://careerforge:careerforge@localhost:5432/careerforge
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Each check tees its output to a file so the summary step can show the
      # reason for a failure on the run's Summary page. Later checks still run
      # after an earlier one fails (`!cancelled()`), so one problem can't hide others.
      - name: Django system checks
        run: |
          set -o pipefail
          python manage.py check 2>&1 | tee check-output.txt

      - name: Migrations are up to date
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python manage.py makemigrations --check --dry-run 2>&1 | tee migrations-output.txt

      - name: OpenAPI schema generates without warnings
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python manage.py spectacular --fail-on-warn --file /tmp/schema.yml 2>&1 | tee schema-output.txt

      - name: Run tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pytest --cov=apps --cov-report=term-missing 2>&1 | tee pytest-output.txt

      # Shows the pass count and coverage table on the run's Summary page,
      # so nobody has to dig through step logs.
      - name: Publish test summary
        if: always()
        run: |
          {
            for f in check-output.txt migrations-output.txt schema-output.txt; do
              if [ -s "$f" ] && grep -qiE "error|warning|changes detected|Traceback" "$f"; then
                echo "## Problems in ${f%-output.txt} step"
                echo '```'
                tail -n 40 "$f"
                echo '```'
              fi
            done
            echo "## Test results"
            echo '```'
            grep -E "^=+ .*(passed|failed|error).* =+$" pytest-output.txt | tail -n 1 || echo "no pytest summary line found"
            grep -E "^(FAILED|ERROR) " pytest-output.txt | head -n 30 || true
            echo '```'
            echo "## Coverage"
            coverage report --format=markdown || echo "coverage report unavailable"
          } >> "$GITHUB_STEP_SUMMARY"
