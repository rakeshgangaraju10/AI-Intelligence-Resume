name: Keep site awake

# Render's free web service sleeps after ~15 idle minutes and takes up to a
# minute to wake, which makes a visitor's first request slow or time out.
# Pinging the health endpoint every 10 minutes keeps it awake. One always-on
# free service uses ~730 of the 750 free instance hours per month.
# GitHub may delay scheduled runs at busy times, so this reduces sleeping
# rather than guaranteeing it. Disable this workflow to stop the pings.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        env:
          SITE_URL: https://careerforge-h362.onrender.com
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$SITE_URL/api/v1/health/" || true)
          echo "health: HTTP $code"
          echo "::notice title=keep-awake::health returned HTTP $code"
