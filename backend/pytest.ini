[pytest]
# --ds on the command line (addopts) outranks a DJANGO_SETTINGS_MODULE environment
# variable, so tests always use test settings even inside the dev container.
addopts = -ra --strict-markers --ds=config.settings.test
python_files = test_*.py
testpaths = tests
# PyMuPDF's SWIG bindings emit these on import under Python 3.12. They are
# third-party and harmless; hiding them keeps our own warnings visible.
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
