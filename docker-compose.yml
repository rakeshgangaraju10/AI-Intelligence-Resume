# Local development stack: PostgreSQL + Django dev server.
#   cp .env.example .env    (then edit DATABASE_URL host to "db" — see below)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerforge}
      POSTGRES_USER: ${POSTGRES_USER:-careerforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      # Inside the compose network the database host is "db", not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-careerforge}:${POSTGRES_PASSWORD:-careerforge}@db:5432/${POSTGRES_DB:-careerforge}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/scripts:ro
      - resume_files:/app/private_media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  resume_files:
